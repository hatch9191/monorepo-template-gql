name: CI

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      POSTGRES_DB_URL: postgresql://postgres:postgres@localhost:5435/template
      NEXT_PUBLIC_GRAPHQL_API_BASE_URI: http://localhost:4100/graphql
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Unit tests
        run: bun run test:unit

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Codegen stays committed
        run: |
          bun run codegen
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build Storybook
        run: bun run build-storybook

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      NEXT_PUBLIC_GRAPHQL_API_BASE_URI: http://localhost:4100/graphql
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web-app

      - name: Browser test
        run: bun run --filter web-app test:e2e

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
