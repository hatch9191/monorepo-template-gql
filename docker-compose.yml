services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template"]
      interval: 5s
      timeout: 5s
      retries: 10

  graphql:
    build:
      context: .
      dockerfile: apps/graphql/Dockerfile
    environment:
      POSTGRES_DB_URL: postgresql://postgres:postgres@postgres:5432/template
      WEB_APP_ORIGIN: http://localhost:3100
      PORT: "4100"
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy

  webhooks:
    build:
      context: .
      dockerfile: apps/webhooks/Dockerfile
    environment:
      WEBHOOK_SECRET: dev-webhook-secret
      PORT: "4101"
    ports:
      - "4101:4101"

  web:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_API_BASE_URI: http://localhost:4100/graphql
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3100"
      GRAPHQL_API_INTERNAL_URI: http://graphql:4100/graphql
    ports:
      - "3100:3100"
    depends_on:
      - graphql
